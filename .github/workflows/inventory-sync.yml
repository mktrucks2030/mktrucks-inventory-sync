name: MK Trucks Inventory Sync

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib google-api-python-client pandas openpyxl requests

      - name: Run inventory sync
        env:
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          MATRIXIFY_API_KEY:   ${{ secrets.MATRIXIFY_API_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GH_PAT }}
          RC_EMAIL:            ${{ secrets.RC_EMAIL }}
          RC_PASSWORD:         ${{ secrets.RC_PASSWORD }}
        run: python sync.py
