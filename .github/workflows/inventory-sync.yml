name: MK Trucks Inventory Sync

on:
  schedule:
    # Corre cada 12 horas: 6 AM y 6 PM UTC (2 AM y 2 PM EST)
    - cron: '0 6,18 * * *'
  workflow_dispatch:  # También permite correrlo manualmente

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run inventory sync
        env:
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          MATRIXIFY_API_KEY:   ${{ secrets.MATRIXIFY_API_KEY }}
          SHOPIFY_STORE:       ${{ secrets.SHOPIFY_STORE }}
        run: python scripts/sync.py
